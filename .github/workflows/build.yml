# Build and test on every push to main and on pull requests, on the three desktop platforms:
# Spotless, every module compiled, every test, and the JavaFX boundary check (./gradlew build).
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # JDK 25 on the runner satisfies both the daemon JVM criteria and the toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        shell: bash
        run: ./gradlew build
