# Build and test on every push to main and on pull requests, on the three desktop platforms:
# Spotless, every module compiled, every test, and the JavaFX boundary check (./gradlew build);
# then the UI tests (tools/ui_tests.sh), which open a real window, with their screenshots kept
# as an artifact per platform.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # JDK 25 on the runner satisfies both the daemon JVM criteria and the toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        shell: bash
        run: ./gradlew build

  ui-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the X virtual framebuffer and the GTK and GL libraries
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgl1
      # Linux has no display, so the run gets a virtual one; macOS and Windows run on the
      # runner's desktop session.
      - name: UI tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a tools/ui_tests.sh
          else
            tools/ui_tests.sh
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: app/build/ui-screenshots/**
