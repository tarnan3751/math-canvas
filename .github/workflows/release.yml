# On a tag vX.Y.Z: build and package the installer on each platform with version X.Y.Z, and the
# documentation site as a zip, then collect the four into a draft prerelease for the owner to
# publish. Installers are unsigned. pages.yml publishes the same site to GitHub Pages. The assets
# are named after the application (app/build.gradle.kts's appName), never a literal: an installer
# after the file jpackage wrote, the site after the name the build put in app.properties.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install fakeroot for the deb
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build and package
        shell: bash
        run: ./gradlew build jpackage "-Pversion=${GITHUB_REF_NAME#v}"
      - name: Name the installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          os="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          mkdir -p dist
          for installer in app/build/jpackage/*.dmg app/build/jpackage/*.msi app/build/jpackage/*.deb; do
            [ -f "$installer" ] || continue
            # jpackage writes <name>-<packageVersion>.dmg|msi and <name>_<version>_<arch>.deb
            base="$(basename "$installer")"
            base="${base%.*}"
            case "$installer" in
              *.deb) stem="${base%%_*}" ;;
              *) stem="${base%-*}" ;;
            esac
            cp "$installer" "dist/$stem-$version-$os-$arch.${installer##*.}"
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the site
        shell: bash
        run: ./gradlew :docs:site :app:processResources "-Pversion=${GITHUB_REF_NAME#v}"
      - name: Archive the site
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="$(sed -n 's/^name=//p' app/build/resources/main/mathcanvas/app/app.properties)"
          [ -n "$name" ] || { echo "no name in app.properties" >&2; exit 1; }
          mkdir -p dist
          cd build
          mv site "$name-$version-site"
          zip -qr "../dist/$name-$version-site.zip" "$name-$version-site"
          ls -l ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/*
          if-no-files-found: error

  release:
    needs: [package, site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --prerelease --generate-notes
