# The app's user-facing texts, read through mathcanvas.app.ui.Messages with MessageFormat, so a
# single quote is written twice. Phase 9 localises this bundle.

window.title=math-canvas {0}

toolbar.undo=Undo
toolbar.redo=Redo
toolbar.stop=Stop
toolbar.theme=Theme: {0}
toolbar.keypad=Keypad
theme.SYSTEM=System
theme.LIGHT=Light
theme.DARK=Dark

cell.prompt=Type an expression and press Enter
# under a cell whose text is offered as a definition (f(x) = body with a fresh f)
hint.define=Define {0}? Enter defines it; Shift+Enter evaluates the equation as written.

# what a cell shows while it waits for the worker, and when its evaluation was stopped
output.pending=…
output.cancelled=(cancelled)
output.copy=Copy
# after a result or an error cut at Shown.MAX_SHOWN characters
output.more=\u2026 ({0} more characters)

# the status line; the technical reason, when there is one, is in its tooltip
status.setAside={0} could not be read and was moved aside as {1}; starting without it.
status.unreadable={0} could not be read and will not be overwritten; starting without it.
status.noDataDirectory=The data directory {0} could not be created; nothing will be saved.
status.saveFailed=Saving failed; recent changes may not be kept.

# printed on standard error before the window opens
startup.EMPTY_ARGUMENT=math-canvas: --data-dir needs a directory
startup.MISSING_ARGUMENT=math-canvas: --data-dir needs a directory after it
startup.BLANK_PROPERTY=math-canvas: the property mathcanvas.dataDir is blank
startup.unknownArgument=math-canvas: ignoring the argument {0}

