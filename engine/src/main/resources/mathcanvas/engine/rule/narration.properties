# Narration of the engine's rules, read by DefaultNarrator.
# Key: <rule set>.<rule>. Value: a java.text.MessageFormat pattern whose arguments {0}, {1}, ...
# are the rule's bound pattern variables in alphabetical order of their names; {before} and {after}
# are the rewrite's before and after. A single quote is written '' (MessageFormat quoting). A rule
# with no key is narrated by its name.
# The rule sets add their keys as they land; Phase 9 localises this bundle.
#
# The per-operation narrators (eval.Narration) add the keys <operation>.step.<name> for the steps
# that group several rewrites, and step.<name> for how pieces of a text join; their arguments are
# named beside each key, and {list} is a list the narrator writes out.

