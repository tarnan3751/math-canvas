# Narration of the engine's rules, read by DefaultNarrator.
# Key: <rule set>.<rule>. Value: a java.text.MessageFormat pattern whose arguments {0}, {1}, ...
# are the rule's bound pattern variables in alphabetical order of their names; {before} and {after}
# are the rewrite's before and after. A single quote is written '' (MessageFormat quoting). A rule
# with no key is narrated by its name.
# The rule sets add their keys as they land; Phase 9 localises this bundle.

# expand (bindings: a_, b_, n_; n_, s_; rest__, s_)
expand.binomial-theorem=Expand {before} by the binomial theorem
expand.expand-power=Multiply out {before}
expand.distribute=Distribute {before} over its sums

# factor (the default factor provider's steps and the conversion before them; bindings as named)
factor.common-denominator=Bring {before} over a common denominator
factor.cancel=Cancel the common factors of {before}
factor.pull-content=Take the common factor {0} out of {before}
factor.pull-power=Take the common factor {0} out of {before}
factor.square-free-split=Separate the repeated factors of {before}
factor.split-content=Take the factor {0}, which is free of {1}, out of {before}
factor.rational-root={1} is a root, so {0} is a factor of {before}
factor.kronecker-split=Find the factor {0} of {before} by Kronecker''s method
factor.homogeneous-split=Factor {before} with {0} = 1, then restore the powers of {0}
factor.bivariate-split=Find the factor {0} of {before} by Kronecker''s substitution

# provider: a provider's result when it recorded no steps, named after the provider (no bindings)
provider.default=Compute {after} with the engine''s own algorithm

# basic (bindings in alphabetical order of the names in each rule's pattern)
basic.undefined-argument=A function of undefined is undefined: {before} = undefined
basic.abs-of-abs=An absolute value is non-negative: {before} = {after}
basic.abs-of-nonnegative={0} ≥ 0, so {before} = {after}
basic.abs-of-nonpositive={0} ≤ 0, so {before} = {after}
basic.abs-of-complex-number=The modulus of {0} is the square root of the sum of the squares of its parts
basic.abs-of-product=The absolute value of a product is the product of the absolute values: {before} = {after}
basic.abs-of-power=For the real exponent {0}, {before} = {after}
basic.abs-to-even-power={0} is even, so {before} = {after}
basic.sign-of-positive={0} > 0, so {before} = 1
basic.sign-of-negative={0} < 0, so {before} = -1
basic.sign-of-zero={0} = 0, so {before} = 0
basic.sign-of-product=The sign of a product is the product of the signs: {before} = {after}
basic.sign-times-abs=sign({1})·|{1}| = {1}
basic.power-of-power-nonnegative={2} ≥ 0, so the exponents multiply: {before} = {after}
basic.power-of-even-power={1} is even, so the even power of {2} is that of |{2}|: {before} = {after}
basic.power-of-product={2} ≥ 0, so the power of the product splits: {before} = {after}
basic.minus-one-to-even-power={0} is even, so {before} = 1
basic.minus-one-to-odd-power={0} is odd, so {before} = -1
basic.zero-to-positive-power={0} > 0, so {before} = 0

# exp-log
exp-log.exp-to-power=Write {before} as a power of e: {after}
exp-log.ln-to-log=ln is the natural logarithm log: {before} = {after}
exp-log.log10-to-base=log10 is the logarithm to base 10: {before} = {after}
exp-log.log2-to-base=log2 is the logarithm to base 2: {before} = {after}
exp-log.log-to-base-one=There is no logarithm to base 1: {before} is undefined
exp-log.log-of-zero-to-base=There is no logarithm of 0: {before} is undefined
exp-log.log-base-exact={0} is a rational power of {1}: {before} = {after}
exp-log.log-change-of-base=Change to natural logarithms: {before} = {after}
exp-log.log-of-zero=There is no logarithm of 0: log(0) is undefined
exp-log.log-of-one=log(1) = 0
exp-log.log-of-e=log(e) = 1
exp-log.log-of-exp={0} is real, so {before} = {0}
exp-log.exp-of-log={2} > 0, so e to the power log({2}) is {2}: {before} = {after}
exp-log.log-of-power={1} > 0 and {0} is real, so {before} = {after}
exp-log.log-of-even-power={0} is even, so {before} = {after}
exp-log.log-of-product={1} > 0, so the logarithm of the product splits: {before} = {after}
exp-log.log-of-reciprocal=The logarithm of a reciprocal: {before} = {after}
exp-log.log-of-negative={0} < 0, so {before} = {after} (principal value)
