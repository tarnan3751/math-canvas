# Narration of the engine's rules, read by DefaultNarrator.
# Key: <rule set>.<rule>. Value: a java.text.MessageFormat pattern whose arguments {0}, {1}, ...
# are the rule's bound pattern variables in alphabetical order of their names; {before} and {after}
# are the rewrite's before and after. A single quote is written '' (MessageFormat quoting). A rule
# with no key is narrated by its name.
#
# The per-operation narrators (eval.Narration) add the keys <operation>.step.<name> for the steps
# that group several rewrites, and step.<name> for how pieces of a text join; their arguments are
# named beside each key, and {list} is a list the narrator writes out.

# step: how the pieces of a text join, two at a time ({0} what came before, {1} the next piece):
# the items of a list, and sentences on one line
step.list={0}, {1}
step.sentences={0}. {1}
# simplify.step: the rewrites of one rule on separate subexpressions ({0} the first one's text, {1}
# the list of the others); each of the others is an equation ({0} its before, {1} its after)
simplify.step.many={0}; likewise {1}
simplify.step.equation={0} = {1}
# expand.step: the distributions of one product and the products nested in it
expand.step.multiply-out=Multiply out {before}
# factor.step: the rational roots found one after another; {list} the roots
factor.step.rational-roots={list} are rational roots, so {before} = {after}
# diff.step: the sum rule and the linearity rewrites after it, with or without a constant term
# that falls away; the chain rule with its inner derivative ({0} the function, {1} its argument,
# {2} the outer derivative, {3} the inner one)
diff.step.linearity=Differentiate term by term; the derivative of a constant is 0
diff.step.term-by-term=Differentiate term by term
diff.step.chain=Apply the chain rule to {0}({1}): the outer derivative is {2}, the inner is {3}
# a partial derivative ({0} the variable, {list} the symbols held constant)
diff.step.partial=Differentiate with respect to {0}, treating {list} as constant
# integrate.step: the sum rule and the linearity rewrites after it
integrate.step.term-by-term=Integrate term by term
# solve.step: a quadratic's discriminant and formula as one method ({0} the discriminant)
solve.step.quadratic-formula=The discriminant is {0}; apply the quadratic formula
# limit.step: the lines of a limit's derivation that are no method's own conclusion, and how the
# lines join ({0} … the line's values, named beside each rule below)
limit.step.substitution-where=by substitution, {0} → {1}, for {2}
limit.step.pole-sides=the denominator of {0} has a zero of order {1} at the point and its numerator does not, so {0} → {2} from the left and {3} from the right; the limit is undefined
