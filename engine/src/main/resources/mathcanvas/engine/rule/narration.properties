# Narration of the engine's rules, read by DefaultNarrator.
# Key: <rule set>.<rule>. Value: a java.text.MessageFormat pattern whose arguments {0}, {1}, ...
# are the rule's bound pattern variables in alphabetical order of their names; {before} and {after}
# are the rewrite's before and after. A single quote is written '' (MessageFormat quoting). A rule
# with no key is narrated by its name.
# The rule sets add their keys as they land; Phase 9 localises this bundle.

# expand (bindings: a_, b_, n_; n_, s_; rest__, s_)
expand.binomial-theorem=Expand {before} by the binomial theorem
expand.expand-power=Multiply out {before}
expand.distribute=Distribute {before} over its sums

# factor (the default factor provider's steps and the conversion before them; bindings as named)
factor.common-denominator=Bring {before} over a common denominator
factor.cancel=Cancel the common factors of {before}
factor.pull-content=Take the common factor {0} out of {before}
factor.pull-power=Take the common factor {0} out of {before}
factor.square-free-split=Separate the repeated factors of {before}
factor.split-content=Take the factor {0}, which is free of {1}, out of {before}
factor.rational-root={1} is a root, so {0} is a factor of {before}
factor.kronecker-split=Find the factor {0} of {before} by Kronecker''s method
factor.homogeneous-split=Factor {before} with {0} = 1, then restore the powers of {0}
factor.bivariate-split=Find the factor {0} of {before} by Kronecker''s substitution

# provider: a provider's result when it recorded no steps, named after the provider (no bindings)
provider.default=Compute {after} with the engine''s own algorithm
