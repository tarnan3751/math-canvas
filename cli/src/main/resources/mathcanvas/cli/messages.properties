# The CLI's own texts. Phase 9 localises this bundle.

# a traced value whose evaluation recorded no rewrite, printed where its steps would be
steps.none=(no steps to show)

# help(name): the entry generated from docs/language.md, its lines after the first indented by two
help.entry={0} — {1}
help.arity=arguments: {0}
help.alias=also written {0}
help.examples=examples:
help.none=no help for {0}: `help` takes the name of a function or a command; the operators, `mod` included, are in the app''s Help window
